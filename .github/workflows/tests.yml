name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bots
      DB_HOST: localhost
      REDIS_HOST: redis://localhost
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # Not a service container: those can't be built from a Dockerfile, and
      # this image turns on SSL and requires it, like production does.
      - name: Start Postgres with SSL
        run: |
          docker build -t bc2-postgres docker/postgresql
          docker run --detach --name postgres --publish 5432:5432 \
            --env POSTGRES_USER="$DB_USER" \
            --env POSTGRES_PASSWORD="$DB_PASSWORD" \
            --env POSTGRES_DB="$DB_NAME" \
            bc2-postgres
          for i in $(seq 30); do
            docker exec postgres pg_isready --host localhost && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          version: "0.13.x"

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          source .venv/bin/activate
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Run tests
        run: python manage.py test
