[project]
name = "big-cases-bot-2"
version = "0.0.1"
description = "Big Cases Bot 2"
authors = [{ name = "Free Law Project", email = "info@free.law" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = [
    "legal",
    "courts",
    "bots",
    "twitter",
    "mastodon",
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

urls.Repository = "https://github.com/freelawproject/bigcases2"
urls."Organisation Homepage" = "https://free.law/"

dependencies = [
    "Django>=6.1.3,<6.2",
    "Mastodon.py>=2.4.0",
    "ada-url>=4.1.1",
    "ansicolors>=1.1.8",
    "art~=6.5",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.44.11",
    "courts-db>=0.10.27",
    "cryptography>=50.0.2",
    "disposable-email-domains>=0.0.298",
    "django-csp~=4.0",
    "django-environ>=0.14.0",
    "django-hcaptcha>=0.2.0",
    "django-htmx>=1.29.0",
    "django-permissions-policy>=4.34.0",
    "django-ratelimit>=4.1.0",
    "django-rq>=4.2.0",
    "django-ses>=4.9.1",
    "django-storages>=1.14.6",
    "django-tailwind>=4.6.0",
    "djangorestframework>=3.18.3",
    "factory-boy>=3.3.3",
    "faker>=40.63.0",
    "gunicorn>=27.0.1",
    "http-ece>=1.2.1",
    "ipython>=9.19.1",
    "pillow>=13.0.0",
    "prettytable>=3.19.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "redis>=8.2.0",
    "requests>=2.34.2",
    "sentry-sdk>=3.0.0",
    "twitterapi>=2.8.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "wheel>=0.48.0",
    "pre-commit>=4.7.0",
    "django-stubs>=6.1.2",
    "types-requests>=2.33.0.20261030",
    "ipython>=9.19.1",
    "django-debug-toolbar>=8.0.0",
    "django-tailwind[reload]>=4.6.0",
]

[tool.uv]
package = false

[tool.'django-stubs']
django_settings_module = "bc.settings"

[tool.mypy]
ignore_missing_imports = true
plugins = "mypy_django_plugin.main"
exclude = "migrations/*"

[[tool.mypy.overrides]]
module="django_stubs_ext.*"
follow_imports="normal"

[tool.ruff]
line-length = 79
lint.select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # pycodestyle
  "E",
  # Pyflakes errors
  "F",
  # isort
  "I",
  # flake8-simplify
  "SIM",
  # flake8-tidy-imports
  "TID",
  # pyupgrade
  "UP",
  # Pyflakes warnings
  "W",
]
lint.ignore = [
  # flake8-bugbear opinionated rules
  "B9",
  # line-too-long
  "E501",
  # suppressible-exception
  "SIM105",
  # if-else-block-instead-of-if-exp
  "SIM108",
]
